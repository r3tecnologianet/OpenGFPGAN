[project]
name = "ogan"
version = "0.0.0"
description = "A clean-room blind face restoration model with verifiable provenance"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["torch==2.14.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Corpus tooling only. Never imported from ogan/, which keeps its single
# dependency on torch. pyarrow is Apache 2.0; pyobjc is MIT.
corpus = ["pyarrow>=17", "pyobjc-framework-Vision>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ogan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
